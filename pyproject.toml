[project]
name = "getwork"
version = "0.1.0"
description = "GetWork: resume and job data pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "langdetect",
    "matplotlib",
    "numpy>=2.4.6",
    "openai>=3.46.0",
    "pandas",
    "plotly",
    "pyarrow",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn",
    "scipy",
    "umap-learn",
    "uvicorn",
]

[project.scripts]
structurer = "getwork.structure.cli:main"
alias-table = "getwork.alias.cli:main"
embed-preflight = "getwork.embed.cli:main"
webapp = "getwork.webapp.cli:main"
taxonomy = "getwork.taxonomy.cli:main"
relabel = "getwork.relabel.cli:main"
doc-embed = "getwork.docembed.cli:main"
retrieve = "getwork.retrieval.cli:main"

[project.optional-dependencies]
agent = [
    "langgraph",
]
embed = [
    "sentence-transformers",
    "torch",
]

[dependency-groups]
dev = [
    "httpx",
    "langgraph",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["getwork*"]

[tool.setuptools.package-data]
"getwork.structure" = ["prompts/*.md"]
"getwork.alias" = ["alias_curated.csv", "version_families.csv", "prompts/*.md"]
"getwork.agent" = ["prompts/*.md"]
"getwork.taxonomy" = ["prompts/*.md"]
"getwork.relabel" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
